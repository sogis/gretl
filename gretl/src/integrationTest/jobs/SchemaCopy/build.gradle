import ch.so.agi.gretl.tasks.*

apply plugin: 'ch.so.agi.gretl'

def dbUriProperty = 'gretltest_dburi_pg'
def dbUri = findProperty(dbUriProperty) != null
        ? findProperty(dbUriProperty)
        : 'jdbc:postgresql://localhost:5432/gretl'

defaultTasks 'copyData'

tasks.register('copyData', SchemaCopy) {
    database = [dbUri, 'dmluser', 'dmluser']
    sourceSchema = 'schemacopytasktest_src'
    targetSchema = 'schemacopytasktest_pub'
    tables = ['roads', 'addresses']
    tablesWithFilter = [
            'parcels', "status = 'PUBLIC'",
            'buildings', 'published = true'
    ]
}
